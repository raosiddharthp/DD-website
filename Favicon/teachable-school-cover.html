<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2000">
<title>DataDomine — Teachable School Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@300;400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2000px;
    height: 800px;
    overflow: hidden;
  }

  .cover {
    width: 2000px;
    height: 800px;
    position: relative;
  }

  /* Top half: Deep Ink */
  .top-half {
    position: absolute;
    top: 0;
    left: 0;
    width: 2000px;
    height: 400px;
    background: #0D1117;
    display: flex;
    align-items: center;
    padding: 0 120px;
  }

  .top-content {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .wordmark {
    display: flex;
    align-items: baseline;
    line-height: 1;
  }

  .wordmark-data {
    font-family: 'IBM Plex Serif', serif;
    font-weight: 300;
    font-size: 72px;
    color: #F8F6F1;
    letter-spacing: -1px;
  }

  .wordmark-domine {
    font-family: 'IBM Plex Serif', serif;
    font-weight: 700;
    font-size: 72px;
    color: #F8F6F1;
    letter-spacing: -1px;
  }

  .wordmark-domine .amber {
    color: #D97706;
  }

  .tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 18px;
    color: #64748B;
    letter-spacing: 0.05em;
  }

  /* Bottom half: Architectural White */
  .bottom-half {
    position: absolute;
    top: 400px;
    left: 0;
    width: 2000px;
    height: 400px;
    background: #F8F6F1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 120px;
    gap: 20px;
  }

  /* Amber accent rule above framework heading */
  .accent-rule {
    width: 48px;
    height: 3px;
    background: #D97706;
    margin-bottom: 4px;
  }

  .framework-heading {
    font-family: 'IBM Plex Serif', serif;
    font-weight: 700;
    font-size: 44px;
    color: #0D1117;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .framework-sub {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 20px;
    color: #64748B;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="cover">

  <!-- Top half: Deep Ink — wordmark + tagline -->
  <div class="top-half">
    <div class="top-content">
      <div class="wordmark">
        <span class="wordmark-data">Data</span>
        <span class="wordmark-domine"><span class="amber">D</span>omine</span>
      </div>
      <div class="tagline">Production-Ready. By Design.</div>
    </div>
  </div>

  <!-- Bottom half: Architectural White — framework copy -->
  <div class="bottom-half">
    <div class="accent-rule"></div>
    <div class="framework-heading">The Clarity Point Framework</div>
    <div class="framework-sub">Production-ready practitioners. By design.</div>
  </div>

</div>
</body>
</html>
