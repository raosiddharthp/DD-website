<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataDomine — og-framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@300;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }

  :root {
    --deep-ink: #0D1117;
    --white: #F8F6F1;
    --slate: #64748B;
    --amber: #D97706;
  }

  .canvas {
    width: 1200px;
    height: 630px;
    background: var(--white);
    position: relative;
    display: flex;
  }

  /* Left amber vertical rule */
  .amber-rule {
    width: 8px;
    height: 630px;
    background: var(--amber);
    flex-shrink: 0;
  }

  /* Main content */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 52px 72px 44px 72px;
  }

  .centre {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-top: auto;
    margin-bottom: auto;
  }

  .label {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--amber);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .heading {
    font-family: 'IBM Plex Serif', serif;
    font-weight: 700;
    font-size: 62px;
    color: var(--deep-ink);
    letter-spacing: -1.5px;
    line-height: 1.05;
  }

  .subheading {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 20px;
    color: var(--slate);
    line-height: 1.5;
    max-width: 680px;
  }

  /* Bottom */
  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .wordmark {
    display: flex;
    align-items: baseline;
  }

  .wordmark-data {
    font-family: 'IBM Plex Serif', serif;
    font-weight: 300;
    font-size: 26px;
    color: var(--deep-ink);
    letter-spacing: -0.3px;
  }

  .wordmark-domine {
    font-family: 'IBM Plex Serif', serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--deep-ink);
    letter-spacing: -0.3px;
  }

  .wordmark-domine .d-amber {
    color: var(--amber);
  }

  .domain {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 13px;
    color: var(--slate);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="amber-rule"></div>
  <div class="content">
    <div class="centre">
      <div class="label">DataDomine</div>
      <div class="heading">The Clarity Point<br>Framework</div>
      <div class="subheading">The point at which complexity resolves into a decision you can defend.</div>
    </div>
    <div class="bottom">
      <div class="wordmark">
        <span class="wordmark-data">Data</span>
        <span class="wordmark-domine"><span class="d-amber">D</span>omine</span>
      </div>
      <div class="domain">datadomine.com</div>
    </div>
  </div>
</div>
</body>
</html>
