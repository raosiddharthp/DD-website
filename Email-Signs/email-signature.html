<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Signature — Siddharth Potukuchi · DataDomine</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">

<!--
  ══════════════════════════════════════════════════════════
  DataDomine — Email Signature
  Siddharth Potukuchi · Founder
  ══════════════════════════════════════════════════════════
  Table-based layout for Gmail, Outlook, Apple Mail
  No external images · No JavaScript · Max width 520px
  All marks inline SVG or CSS
  Typefaces: IBM Plex Serif (display) · Inter (body)
  Colours: Deep Ink #0D1117 · Slate #64748B · Amber #D97706
  ══════════════════════════════════════════════════════════
-->

<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="520"
  style="
    max-width:520px;
    width:100%;
    font-family:'Inter',Arial,sans-serif;
    border-collapse:collapse;
    -webkit-text-size-adjust:none;
    mso-table-lspace:0pt;
    mso-table-rspace:0pt;
  "
>

  <!-- ── ROW 1: Mark + Name block ── -->
  <tr>
    <td style="padding:0;vertical-align:middle;width:32px;">

      <!-- Domine Mark: amber dot centred at top of ink vertical -->
      <!-- Proportions: vertical 4u wide × 40u tall; dot 10u diameter -->
      <!-- SVG canvas: 32px wide × 52px tall (dot above rect) -->
      <svg
        width="32"
        height="52"
        viewBox="0 0 32 52"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="DataDomine mark"
        style="display:block;"
      >
        <!-- Amber dot: 10u diameter → 10px, centred at x=16 y=10 -->
        <circle cx="16" cy="10" r="10" fill="#D97706"/>
        <!-- Ink vertical: 4u wide × 40u tall, centred at x=16, top at y=10 -->
        <rect x="14" y="10" width="4" height="42" fill="#0D1117"/>
      </svg>

    </td>
    <td style="padding:0 0 0 10px;vertical-align:middle;">

      <!-- Name -->
      <div style="
        font-family:'IBM Plex Serif',Georgia,'Times New Roman',serif;
        font-weight:700;
        font-size:16px;
        line-height:1.2;
        color:#0D1117;
        margin:0 0 3px 0;
      ">Siddharth Potukuchi</div>

      <!-- Title -->
      <div style="
        font-family:'Inter',Arial,sans-serif;
        font-weight:400;
        font-size:13px;
        line-height:1.3;
        color:#64748B;
        margin:0;
      ">Founder &middot; DataDomine</div>

    </td>
  </tr>

  <!-- ── ROW 2: Amber rule ── -->
  <tr>
    <td
      colspan="2"
      style="padding:8px 0;"
    >
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="100%"
        style="border-collapse:collapse;"
      >
        <tr>
          <td style="
            height:1px;
            background-color:#D97706;
            font-size:0;
            line-height:0;
          ">&nbsp;</td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- ── ROW 3: Credentials ── -->
  <tr>
    <td
      colspan="2"
      style="
        padding:0 0 6px 0;
        font-family:'Inter',Arial,sans-serif;
        font-weight:300;
        font-size:12px;
        line-height:1.5;
        color:#64748B;
        white-space:nowrap;
      "
    >
      TOGAF EA
      <span style="color:#64748B;">&nbsp;&middot;&nbsp;</span>
      Google Cloud Architect
      <span style="color:#64748B;">&nbsp;&middot;&nbsp;</span>
      Google ML Engineer
    </td>
  </tr>

  <!-- ── ROW 4: Links ── -->
  <tr>
    <td
      colspan="2"
      style="
        padding:0 0 6px 0;
        font-size:12px;
        line-height:1.5;
      "
    >
      <a
        href="https://datadomine.com"
        target="_blank"
        style="
          font-family:'Inter',Arial,sans-serif;
          font-weight:400;
          font-size:12px;
          color:#D97706;
          text-decoration:none;
        "
      >datadomine.com</a>
      <span style="
        font-family:'Inter',Arial,sans-serif;
        font-weight:400;
        font-size:12px;
        color:#64748B;
      ">&nbsp;&middot;&nbsp;</span>
      <a
        href="mailto:hello@datadomine.com"
        style="
          font-family:'Inter',Arial,sans-serif;
          font-weight:400;
          font-size:12px;
          color:#0D1117;
          text-decoration:none;
        "
      >hello@datadomine.com</a>
    </td>
  </tr>

  <!-- ── ROW 5: Tagline ── -->
  <tr>
    <td
      colspan="2"
      style="
        padding:0;
        font-family:'IBM Plex Serif',Georgia,'Times New Roman',serif;
        font-weight:300;
        font-style:italic;
        font-size:11px;
        line-height:1.4;
        color:#64748B;
      "
    >Production-Ready. By Design.</td>
  </tr>

</table>

</body>
</html>
